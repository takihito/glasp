name: glasp smoke test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glasp-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SCRIPT_ID: ${{ secrets.GLASP_SMOKE_SCRIPT_ID }}
    steps:
      # EXPERIMENT (temporary, do not merge as-is): reordered field-cage ->
      # Bullfrog -> harden-runner, and harden-runner switched from block to
      # audit with its allowlist commented out, to check how much of the
      # job's traffic field-cage (placed first) actually observes when
      # nothing blocks it or the tools after it from making calls. See
      # https://github.com/takihito/glasp/actions/runs/32736134793 for the
      # normal-order baseline.
      - name: field-cage egress audit
        uses: takihito/field-cage@1e55f85545b156b80df517807874c6e0a1361878 # v0.1.2
        with:
          version: v0.1.2
          mode: audit

      - name: Bullfrog egress audit
        uses: bullfrogsec/bullfrog@ebd3ce460ed3371d6fd751649fc1637ef0c21a18 # v0.11.0
        with:
          egress-policy: audit

      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          # allowed-endpoints temporarily commented out for this experiment:
          # allowed-endpoints: >
          #   api.github.com:443
          #   github.com:443
          #   objects.githubusercontent.com:443
          #   release-assets.githubusercontent.com:443
          #   script.googleapis.com:443
          #   www.googleapis.com:443
          #   oauth2.googleapis.com:443
          #   azure.archive.ubuntu.com:80
          #   archive.ubuntu.com:80
          #   security.ubuntu.com:80
          #   tuf-repo-cdn.sigstore.dev:443

      - name: Verify required secrets are configured
        env:
          _AUTH: ${{ secrets.GLASP_AUTH }}
          _SCRIPT_ID: ${{ secrets.GLASP_SMOKE_SCRIPT_ID }}
        run: |
          if [ -z "$_AUTH" ]; then
            echo "::error::GLASP_AUTH must be set as a repository secret."
            exit 1
          fi
          if [ -z "$_SCRIPT_ID" ]; then
            echo "::error::GLASP_SMOKE_SCRIPT_ID must be set as a repository secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install glasp
        uses: ./
        with:
          auth: ${{ secrets.GLASP_AUTH }}
          client-id: ${{ secrets.GLASP_CLIENT_ID }}
          client-secret: ${{ secrets.GLASP_CLIENT_SECRET }}

      - name: Prepare workspace
        id: workspace
        run: |
          set -euo pipefail
          dir="$(mktemp -d "${RUNNER_TEMP}/glasp-smoke.XXXXXX")"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: glasp clone
        working-directory: ${{ steps.workspace.outputs.dir }}
        run: glasp clone "$SCRIPT_ID"

      - name: glasp pull
        working-directory: ${{ steps.workspace.outputs.dir }}
        run: glasp pull

      - name: glasp push
        working-directory: ${{ steps.workspace.outputs.dir }}
        run: glasp push

      - name: field-cage audit report
        if: always()
        uses: takihito/field-cage/report@1e55f85545b156b80df517807874c6e0a1361878 # v0.1.2
        with:
          version: v0.1.2
          fail-on-deny: false
